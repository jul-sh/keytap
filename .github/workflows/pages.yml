name: Deploy Worker and Pages

on:
  workflow_call:
    secrets:
      AGE_SECRET_KEY:
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  worker:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: cachix/install-nix-action@51f3067b56fe8ae331890c77d4e454f6d60615ff # v31

      - name: Decrypt Cloudflare API token
        run: |
          nix profile install nixpkgs#age
          CLOUDFLARE_API_TOKEN=$(echo "$AGE_SECRET_KEY" | age -d -i - distribution/secrets/CLOUDFLARE_API_TOKEN.age)
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$CLOUDFLARE_API_TOKEN" >> "$GITHUB_ENV"
        env:
          AGE_SECRET_KEY: ${{ secrets.AGE_SECRET_KEY }}

      - name: Deploy relay Worker
        working-directory: web/relay
        run: npx --yes wrangler@4.115.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}

  pages:
    needs: worker
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM
        run: wasm-pack build --target web web/wasm --out-dir ../pkg --out-name keytap_web

      - name: Prepare site
        run: |
          mkdir -p _site/.well-known
          cp .well-known/apple-app-site-association _site/.well-known/
          cp web/CNAME _site/
          find web -maxdepth 1 -type f \
            \( -name '*.html' -o -name '*.js' -o -name '*.css' -o -name '*.png' -o -name '*.txt' \) \
            ! -name '*.test.js' -exec cp {} _site/ \;
          test -s _site/nearby-sas-words.txt
          cp -r web/fonts _site/fonts
          cp -r web/pkg _site/pkg

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
