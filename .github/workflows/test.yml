name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run tests
        run: |
          cargo test -p keytap-core
          cargo test -p keytap-cli-spec
          cargo test -p keytap
          cargo test -p keytap-web

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Test WebAssembly parity
        run: wasm-pack test --node web/wasm

      - name: Test nearby WebRTC protocol and signal Worker
        run: |
          npm --prefix web test

      # Remembered keys: exercise the real Secret Service backend against a
      # live GNOME Keyring inside an isolated D-Bus session.
      - name: Live Secret Service test
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-keyring
          dbus-run-session -- bash -c '
            echo -n "ci" | gnome-keyring-daemon --unlock --components=secrets
            cargo test -p keytap --bins -- --ignored
          '
