name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run tests
        run: |
          cargo test -p keytap-core
          cargo test -p keytap --no-default-features --bins --test e2e_crypto --test env_keys

      # Remembered keys: exercise the real Secret Service backend against a
      # live GNOME Keyring inside an isolated D-Bus session.
      - name: Live Secret Service test
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-keyring
          dbus-run-session -- bash -c '
            echo -n "ci" | gnome-keyring-daemon --unlock --components=secrets
            cargo test -p keytap --no-default-features --bins -- --ignored
          '
