<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // Route /n/{sessionId} to the nearby page
    const m = location.pathname.match(/^\/n\/([a-zA-Z0-9_-]{8,44})$/);
    if (m) {
      // Rewrite to /nearby with session ID in hash (preserves static hosting)
      location.replace('/nearby#s=' + m[1]);
    }
  </script>
  <meta name="theme-color" content="#000066">
  <title>keytap — not found</title>
  <link rel="stylesheet" href="/theme.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 48px 24px;
      font: 18px/1.65 var(--body);
      color: var(--fg);
      background: var(--bg);
    }
    .eyebrow {
      font-family: var(--display);
      text-transform: uppercase;
      letter-spacing: 0.25em;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 8px;
    }
    .eyebrow::before { content: "> "; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">keytap</p>
    <p>No such page. The terminal lives at <a href="/">keytap.jul.sh</a>.</p>
  </main>
</body>
</html>
