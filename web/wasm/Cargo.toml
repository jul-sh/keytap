[package]
name = "keytap-web"
version.workspace = true
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
keytap-core = { path = "../../core", features = ["encrypt"] }
keytap-cli-spec = { path = "../../cli/spec" }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
# age generates an ephemeral file key per encryption; in the browser that
# entropy comes from crypto.getRandomValues via getrandom's js backend.
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
serde_json = "1"
