<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; connect-src 'self'; form-action 'none'; frame-ancestors 'none'; base-uri 'none'; manifest-src 'none'; worker-src blob:; script-src-elem 'self' blob:">
  <meta name="description" content="keytap turns one passkey into reproducible SSH keys, age identities, and app secrets. This page is a terminal running the real CLI, compiled to WebAssembly.">
  <meta name="theme-color" content="#00003d">
  <meta property="og:title" content="keytap — passkeys that turn into real keys">
  <meta property="og:description" content="A terminal running the real keytap CLI, compiled to WebAssembly. Derive SSH keys, age identities, and app secrets from your passkey.">
  <meta property="og:image" content="https://keytap.jul.sh/icon.png">
  <meta property="og:url" content="https://keytap.jul.sh/">
  <title>keytap — passkeys that turn into real keys</title>
  <link rel="icon" href="./icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./site.css">
  <script type="module" src="./terminal.js"></script>
</head>
<body>

  <header class="term-chrome">
    <h1 class="term-title"><img src="./icon.png" alt="" width="18" height="18">keytap</h1>
    <span class="term-tagline">passkeys that turn into real keys</span>
    <a class="term-link" href="https://github.com/jul-sh/keytap">github</a>
  </header>

  <main class="term-shell">
    <div class="term-screen" id="term-screen">
      <div id="term-out" role="log" aria-live="polite"></div>
      <div class="term-line" id="term-input-line"><span class="term-prompt" id="term-prompt"></span><span id="term-pre"></span><span class="term-cursor" id="term-cursor"> </span><span id="term-post"></span></div>
      <noscript><p class="ln err">JavaScript is off, so the terminal can't run. The CLI itself doesn't need it: github.com/jul-sh/keytap</p></noscript>
    </div>
    <input id="term-kbd" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send" aria-label="terminal input">
  </main>

  <footer class="term-status">
    <span id="term-status" data-mode="busy">loading…</span>
    <span class="term-hints">tab completes · ↑ history · ctrl+c cancels</span>
  </footer>

</body>
</html>
